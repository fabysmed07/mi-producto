<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e2e2df;
    --text: #1f1f1d;
    --muted: #6b6b66;
    --accent: #1f1f1d;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 24px;
  }
  h2 {
    font-size: 16px;
    margin: 0 0 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }
  #login-view {
    max-width: 360px;
    margin: 80px auto 0;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #login-form button {
    width: 100%;
    margin-top: 20px;
  }
  .error {
    color: var(--error);
    font-size: 13px;
    margin-top: 12px;
    min-height: 16px;
  }
  #dashboard-view {
    display: none;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .sections {
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 720px) {
    .sections { grid-template-columns: 1fr; }
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th {
    color: var(--muted);
    font-weight: 500;
  }
  .empty, .loading {
    color: var(--muted);
    font-size: 13px;
    padding: 8px 0;
  }
  .count {
    color: var(--muted);
    font-size: 13px;
    font-weight: normal;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="login-view" class="panel">
      <h1>Admin</h1>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="username" />
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
        <button type="submit">Ingresar</button>
        <div class="error" id="login-error"></div>
      </form>
    </div>

    <div id="dashboard-view">
      <div class="topbar">
        <h1>Admin</h1>
        <button class="secondary" id="logout-btn">Cerrar sesión</button>
      </div>

      <div class="sections">
        <div class="panel">
          <div class="section-header">
            <h2>Signups <span class="count" id="signups-count"></span></h2>
            <button class="secondary" id="download-csv-btn">Descargar CSV</button>
          </div>
          <div id="signups-status" class="loading">Cargando…</div>
          <table id="signups-table" style="display:none">
            <thead><tr><th>Email</th><th>Fecha</th></tr></thead>
            <tbody id="signups-body"></tbody>
          </table>
        </div>

        <div class="panel">
          <div class="section-header">
            <h2>Feedback <span class="count" id="feedback-count"></span></h2>
          </div>
          <div id="feedback-status" class="loading">Cargando…</div>
          <table id="feedback-table" style="display:none">
            <thead><tr><th>Email</th><th>Mensaje</th><th>Fecha</th></tr></thead>
            <tbody id="feedback-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');
    const downloadCsvBtn = document.getElementById('download-csv-btn');

    let currentSignups = [];

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString();
    }

    function showLoggedOut() {
      loginView.style.display = '';
      dashboardView.style.display = 'none';
      loginError.textContent = '';
      loginForm.reset();
    }

    function showLoggedIn() {
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
      loadSignups();
      loadFeedback();
    }

    async function loadSignups() {
      const status = document.getElementById('signups-status');
      const table = document.getElementById('signups-table');
      const body = document.getElementById('signups-body');
      const count = document.getElementById('signups-count');
      status.textContent = 'Cargando…';
      status.style.display = '';
      table.style.display = 'none';

      const { data, error } = await supabase
        .from('signups')
        .select('email, created_at')
        .order('created_at', { ascending: false });

      if (error) {
        status.textContent = 'No se pudieron cargar los signups. Probá recargar la página.';
        currentSignups = [];
        count.textContent = '';
        return;
      }

      currentSignups = data || [];
      count.textContent = '(' + currentSignups.length + ')';

      if (currentSignups.length === 0) {
        status.textContent = 'Todavía no hay signups.';
        return;
      }

      body.innerHTML = currentSignups
        .map(row => `<tr><td>${escapeHtml(row.email)}</td><td>${formatDate(row.created_at)}</td></tr>`)
        .join('');
      status.style.display = 'none';
      table.style.display = '';
    }

    async function loadFeedback() {
      const status = document.getElementById('feedback-status');
      const table = document.getElementById('feedback-table');
      const body = document.getElementById('feedback-body');
      const count = document.getElementById('feedback-count');
      status.textContent = 'Cargando…';
      status.style.display = '';
      table.style.display = 'none';

      const { data, error } = await supabase
        .from('feedback')
        .select('email, texto, created_at')
        .order('created_at', { ascending: false });

      if (error) {
        status.textContent = 'No se pudo cargar el feedback. Probá recargar la página.';
        count.textContent = '';
        return;
      }

      const rows = data || [];
      count.textContent = '(' + rows.length + ')';

      if (rows.length === 0) {
        status.textContent = 'Todavía no hay feedback.';
        return;
      }

      body.innerHTML = rows
        .map(row => `<tr><td>${escapeHtml(row.email || '—')}</td><td>${escapeHtml(row.texto)}</td><td>${formatDate(row.created_at)}</td></tr>`)
        .join('');
      status.style.display = 'none';
      table.style.display = '';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function csvEscape(value) {
      const str = String(value ?? '');
      if (/[",\n]/.test(str)) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    downloadCsvBtn.addEventListener('click', () => {
      const lines = ['email,created_at'];
      for (const row of currentSignups) {
        lines.push(csvEscape(row.email) + ',' + csvEscape(row.created_at));
      }
      const csv = lines.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'signups.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    function translateAuthError(error) {
      const msg = (error.message || '').toLowerCase();
      if (msg.includes('invalid login credentials')) {
        return 'Email o contraseña incorrectos.';
      }
      if (msg.includes('email not confirmed')) {
        return 'El email todavía no fue confirmado.';
      }
      if (msg.includes('too many requests') || msg.includes('for security purposes')) {
        return 'Demasiados intentos. Esperá unos segundos e intentá de nuevo.';
      }
      if (msg.includes('failed to fetch') || msg.includes('network')) {
        return 'No se pudo conectar. Revisá tu conexión.';
      }
      return 'No se pudo iniciar sesión. Intentá de nuevo.';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const submitBtn = loginForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      submitBtn.disabled = false;
      if (error) {
        loginError.textContent = translateAuthError(error);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session) {
        showLoggedIn();
      } else {
        showLoggedOut();
      }
    });

    const { data: { session: initialSession } } = await supabase.auth.getSession();
    if (initialSession) {
      showLoggedIn();
    } else {
      showLoggedOut();
    }
  </script>
</body>
</html>
